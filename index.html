<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win11 Web OS</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        body { background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed; background-size: cover; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Desktop Icons */
        .desktop { flex: 1; position: relative; padding: 20px; display: flex; flex-direction: column; gap: 15px; align-items: flex-start; flex-wrap: wrap; height: calc(100vh - 50px); align-content: flex-start; }
        .desktop-icon { display: flex; flex-direction: column; align-items: center; width: 75px; cursor: pointer; padding: 10px; border-radius: 5px; transition: 0.1s; }
        .desktop-icon:hover { background: rgba(255,255,255,0.1); }
        .desktop-icon img { width: 40px; height: 40px; margin-bottom: 5px; }
        .desktop-icon span { font-size: 12px; color: white; text-shadow: 1px 1px 2px black; text-align: center; }

        /* Windows */
        .window { position: absolute; top: 10%; left: 20%; width: 600px; height: 400px; background: #202020; border: 1px solid #444; border-radius: 8px; display: none; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 100; overflow: hidden; }
        .window.active { display: flex; }
        .window-header { height: 35px; background: #2d2d2d; display: flex; justify-content: space-between; align-items: center; padding: 0 10px; cursor: move; }
        .window-title { color: white; font-size: 12px; display: flex; align-items: center; gap: 8px; }
        .window-controls { display: flex; }
        .win-btn { width: 45px; height: 35px; border: none; background: transparent; color: white; cursor: pointer; font-size: 12px; display: flex; justify-content: center; align-items: center; }
        .win-btn:hover { background: #444; }
        .win-btn.close:hover { background: #e81123; }
        .window-content { flex: 1; background: #1e1e1e; color: white; overflow: auto; position: relative; }

        /* Taskbar */
        .taskbar { height: 50px; background: rgba(32, 32, 32, 0.9); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; gap: 10px; border-top: 1px solid #444; z-index: 1000; }
        .taskbar-icon { width: 40px; height: 40px; border-radius: 5px; display: flex; justify-content: center; align-items: center; font-size: 20px; color: white; cursor: pointer; transition: 0.1s; }
        .taskbar-icon:hover { background: rgba(255,255,255,0.1); }

        /* Start Menu */
        .start-menu { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); width: 500px; height: 500px; background: rgba(32, 32, 32, 0.95); backdrop-filter: blur(20px); border: 1px solid #444; border-radius: 8px; display: none; flex-direction: column; z-index: 1001; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .start-menu.active { display: flex; }
        .start-search { padding: 20px; }
        .start-search input { width: 100%; padding: 10px; border-radius: 20px; border: 1px solid #555; background: #111; color: white; outline: none; }
        .start-apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 20px; }
        .start-app { display: flex; flex-direction: column; align-items: center; padding: 15px; border-radius: 5px; cursor: pointer; }
        .start-app:hover { background: rgba(255,255,255,0.1); }
        .start-app i { font-size: 30px; margin-bottom: 10px; }
        .start-app span { font-size: 12px; }

        /* App Styles */
        .notepad textarea { width: 100%; height: 100%; background: #1e1e1e; color: white; border: none; outline: none; padding: 10px; resize: none; font-family: monospace; }
        .calculator { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 10px; height: 100%; }
        .calc-btn { background: #333; color: white; border: none; border-radius: 5px; font-size: 20px; cursor: pointer; }
        .calc-btn:hover { background: #444; }
        .calc-display { grid-column: span 4; background: #111; text-align: right; padding: 20px; font-size: 30px; border-radius: 5px; margin-bottom: 10px; }
        
        .settings { padding: 20px; }
        .bg-options { display: flex; gap: 10px; margin-top: 20px; }
        .bg-opt { width: 100px; height: 60px; border-radius: 5px; cursor: pointer; background-size: cover; border: 2px solid transparent; }
        .bg-opt:hover { border-color: white; }
    </style>
</head>
<body>

    <!-- Desktop Icons -->
    <div class="desktop">
        <div class="desktop-icon" ondblclick="openApp('notepad')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e4/Windows_Notepad_Icon_%282020%29.svg/512px-Windows_Notepad_Icon_%282020%29.svg.png">
            <span>Notepad</span>
        </div>
        <div class="desktop-icon" ondblclick="openApp('calculator')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/97/Windows_Calculator_icon.svg/512px-Windows_Calculator_icon.svg.png">
            <span>Calculator</span>
        </div>
        <div class="desktop-icon" ondblclick="openApp('settings')">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/07/Windows_Settings_icon.svg/512px-Windows_Settings_icon.svg.png">
            <span>Settings</span>
        </div>

        <!-- Notepad Window -->
        <div class="window" id="win-notepad" style="width: 500px; height: 400px;">
            <div class="window-header" onmousedown="startDrag(event, 'win-notepad')">
                <div class="window-title"><i class="fas fa-file-alt"></i> Notepad</div>
                <div class="window-controls">
                    <button class="win-btn" onclick="minimizeApp('win-notepad')"><i class="fas fa-minus"></i></button>
                    <button class="win-btn close" onclick="closeApp('win-notepad')"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="window-content notepad">
                <textarea placeholder="Type something here..." oninput="localStorage.setItem('win11notes', this.value)"></textarea>
            </div>
        </div>

        <!-- Calculator Window -->
        <div class="window" id="win-calculator" style="width: 300px; height: 400px;">
            <div class="window-header" onmousedown="startDrag(event, 'win-calculator')">
                <div class="window-title"><i class="fas fa-calculator"></i> Calculator</div>
                <div class="window-controls">
                    <button class="win-btn" onclick="minimizeApp('win-calculator')"><i class="fas fa-minus"></i></button>
                    <button class="win-btn close" onclick="closeApp('win-calculator')"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="window-content">
                <div class="calculator">
                    <div class="calc-display" id="calc-display">0</div>
                    <button class="calc-btn" onclick="calc('C')">C</button>
                    <button class="calc-btn" onclick="calc('/')">/</button>
                    <button class="calc-btn" onclick="calc('*')">*</button>
                    <button class="calc-btn" onclick="calc('-')">-</button>
                    <button class="calc-btn" onclick="calc('7')">7</button>
                    <button class="calc-btn" onclick="calc('8')">8</button>
                    <button class="calc-btn" onclick="calc('9')">9</button>
                    <button class="calc-btn" onclick="calc('+')">+</button>
                    <button class="calc-btn" onclick="calc('4')">4</button>
                    <button class="calc-btn" onclick="calc('5')">5</button>
                    <button class="calc-btn" onclick="calc('6')">6</button>
                    <button class="calc-btn" style="grid-row: span 2;" onclick="calc('=')">=</button>
                    <button class="calc-btn" onclick="calc('1')">1</button>
                    <button class="calc-btn" onclick="calc('2')">2</button>
                    <button class="calc-btn" onclick="calc('3')">3</button>
                    <button class="calc-btn" style="grid-column: span 3;" onclick="calc('0')">0</button>
                </div>
            </div>
        </div>

        <!-- Settings Window -->
        <div class="window" id="win-settings" style="width: 400px; height: 300px;">
            <div class="window-header" onmousedown="startDrag(event, 'win-settings')">
                <div class="window-title"><i class="fas fa-cog"></i> Settings</div>
                <div class="window-controls">
                    <button class="win-btn" onclick="minimizeApp('win-settings')"><i class="fas fa-minus"></i></button>
                    <button class="win-btn close" onclick="closeApp('win-settings')"><i class="fas fa-times"></i></button>
                </div>
            </div>
            <div class="window-content settings">
                <h3>Personalization</h3>
                <p style="font-size: 12px; color: #aaa; margin-top: 5px;">Change your desktop background</p>
                <div class="bg-options">
                    <div class="bg-opt" style="background-image: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=200');" onclick="setBG('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000')"></div>
                    <div class="bg-opt" style="background-image: url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=200');" onclick="setBG('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=2000')"></div>
                    <div class="bg-opt" style="background-image: url('https://images.unsplash.com/photo-1533130061792-64b345e4a833?q=80&w=200');" onclick="setBG('https://images.unsplash.com/photo-1533130061792-64b345e4a833?q=80&w=2000')"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Start Menu -->
    <div class="start-menu" id="start-menu">
        <div class="start-search">
            <input type="text" placeholder="Type here to search...">
        </div>
        <div class="start-apps">
            <div class="start-app" onclick="openApp('notepad')"><i class="fas fa-file-alt" style="color: #4fc3f7;"></i><span>Notepad</span></div>
            <div class="start-app" onclick="openApp('calculator')"><i class="fas fa-calculator" style="color: #81c784;"></i><span>Calculator</span></div>
            <div class="start-app" onclick="openApp('settings')"><i class="fas fa-cog" style="color: #b0bec5;"></i><span>Settings</span></div>
        </div>
    </div>

    <!-- Taskbar -->
    <div class="taskbar">
        <div class="taskbar-icon" onclick="toggleStart()"><i class="fab fa-windows" style="color: #00a4ef;"></i></div>
        <div class="taskbar-icon" onclick="openApp('notepad')"><i class="fas fa-file-alt" style="color: #4fc3f7;"></i></div>
        <div class="taskbar-icon" onclick="openApp('calculator')"><i class="fas fa-calculator" style="color: #81c784;"></i></div>
        <div class="taskbar-icon" onclick="openApp('settings')"><i class="fas fa-cog" style="color: #b0bec5;"></i></div>
    </div>

    <script>
        // Start Menu Logic
        function toggleStart() {
            document.getElementById('start-menu').classList.toggle('active');
        }

        // Window Management
        function openApp(app) {
            document.getElementById('start-menu').classList.remove('active');
            const win = document.getElementById(`win-${app}`);
            win.classList.add('active');
            win.style.zIndex = 1000; // Bring to front
        }

        function closeApp(app) {
            document.getElementById(`win-${app}`).classList.remove('active');
        }

        function minimizeApp(app) {
            document.getElementById(`win-${app}`).classList.remove('active');
        }

        // Drag Logic
        let activeWindow = null;
        let offsetX = 0, offsetY = 0;

        function startDrag(e, id) {
            activeWindow = document.getElementById(id);
            activeWindow.style.zIndex = 1000;
            offsetX = e.clientX - activeWindow.getBoundingClientRect().left;
            offsetY = e.clientY - activeWindow.getBoundingClientRect().top;
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
        }

        function drag(e) {
            if (!activeWindow) return;
            activeWindow.style.left = (e.clientX - offsetX) + 'px';
            activeWindow.style.top = (e.clientY - offsetY) + 'px';
        }

        function stopDrag() {
            activeWindow = null;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
        }

        // Notepad Logic
        const savedNotes = localStorage.getItem('win11notes');
        if(savedNotes) document.querySelector('.notepad textarea').value = savedNotes;

        // Calculator Logic
        let calcString = "";
        function calc(val) {
            const display = document.getElementById('calc-display');
            if(val === 'C') { calcString = ""; display.innerText = "0"; return; }
            if(val === '=') {
                try { calcString = eval(calcString).toString(); display.innerText = calcString; } 
                catch { display.innerText = "Error"; calcString = ""; }
                return;
            }
            calcString += val;
            display.innerText = calcString;
        }

        // Settings Logic
        function setBG(url) {
            document.body.style.backgroundImage = `url('${url}')`;
        }
    </script>
</body>
</html>
