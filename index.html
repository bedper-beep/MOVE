<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostMovies</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: #0f0f0f; color: white; overflow-x: hidden; }

        /* Navbar */
        .navbar { position: fixed; top: 0; width: 100%; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%); z-index: 100; transition: 0.3s; }
        .nav-left { display: flex; align-items: center; gap: 30px; }
        .logo { font-size: 24px; font-weight: 800; color: #ff3333; letter-spacing: 1px; cursor: pointer; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #ddd; text-decoration: none; font-size: 14px; font-weight: 600; transition: 0.2s; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: white; }
        .nav-right { display: flex; gap: 20px; font-size: 18px; color: white; cursor: pointer; }

        /* Hero Banner */
        .hero { height: 80vh; background-size: cover; background-position: center top; position: relative; display: flex; align-items: flex-end; padding: 50px; }
        .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, #0f0f0f 0%, transparent 60%), linear-gradient(to right, #0f0f0f 0%, transparent 50%); }
        .hero-content { position: relative; z-index: 10; max-width: 600px; }
        .hero-title { font-size: 56px; font-weight: 800; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; text-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .hero-meta { display: flex; align-items: center; gap: 15px; font-size: 13px; color: #ccc; margin-bottom: 15px; }
        .badge { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; font-weight: bold; backdrop-filter: blur(5px); }
        .hero-desc { font-size: 15px; line-height: 1.5; color: #ddd; margin-bottom: 25px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-btns { display: flex; gap: 15px; }
        .btn { padding: 12px 25px; border-radius: 8px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.2s; }
        .btn-play { background: white; color: black; }
        .btn-play:hover { background: #ddd; transform: scale(1.05); }
        .btn-info { background: rgba(255,255,255,0.2); color: white; backdrop-filter: blur(5px); }
        .btn-info:hover { background: rgba(255,255,255,0.3); }

        /* Rows */
        .row { padding: 20px 50px; margin-bottom: 30px; position: relative; z-index: 10; }
        .row-title { font-size: 20px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .row-title::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
        .slider { display: flex; gap: 15px; overflow-x: scroll; scroll-behavior: smooth; padding-bottom: 20px; }
        .slider::-webkit-scrollbar { display: none; }
        .movie-card { min-width: 200px; width: 200px; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.3s, z-index 0.3s; position: relative; background: #222; }
        .movie-card:hover { transform: scale(1.08); z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .movie-card img { width: 100%; height: 300px; object-fit: cover; display: block; }
        .movie-info { padding: 10px; position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, #000, transparent); }
        .movie-title { font-size: 14px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-year { font-size: 12px; color: #aaa; }

        /* Player Overlay */
        .player-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; flex-direction: column; }
        .player-overlay.active { display: flex; }
        .player-header { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background: #111; border-bottom: 1px solid #333; }
        .player-header h2 { font-size: 18px; }
        .player-iframe-container { flex: 1; background: #000; position: relative; }
        .player-iframe-container iframe { width: 100%; height: 100%; border: none; }
        .close-player { background: #ff3333; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        
        /* Spinner */
        .spinner { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 50px; height: 50px; border: 4px solid #333; border-top-color: #ff3333; border-radius: 50%; animation: spin 1s linear infinite; z-index: 10; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="navbar" id="navbar">
        <div class="nav-left">
            <div class="logo" onclick="window.scrollTo(0,0)">GHOSTMOVIES</div>
            <div class="nav-links">
                <a class="active">Home</a>
                <a>Movies</a>
                <a>TV Shows</a>
            </div>
        </div>
        <div class="nav-right">
            <i class="fas fa-search"></i>
        </div>
    </div>

    <div class="hero" id="hero-banner">
        <div class="hero-content">
            <div class="hero-title" id="hero-title">Loading...</div>
            <div class="hero-meta">
                <span class="badge" style="color:#f5c518;">IMDb 8.5</span>
                <span id="hero-year">2024</span>
                <span class="badge">4K Ultra HD</span>
            </div>
            <div class="hero-desc" id="hero-desc">Loading description...</div>
            <div class="hero-btns">
                <button class="btn btn-play" id="hero-play-btn"><i class="fas fa-play"></i> Play</button>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="row-title">Trending Now</div>
        <div class="slider" id="trending-row"></div>
    </div>

    <div class="row">
        <div class="row-title">Popular Movies</div>
        <div class="slider" id="movies-row"></div>
    </div>

    <!-- Fullscreen Player Overlay -->
    <div class="player-overlay" id="player-overlay">
        <div class="player-header">
            <h2 id="player-title">Watching Movie</h2>
            <button class="close-player" onclick="closePlayer()">Close Player</button>
        </div>
        <div class="player-iframe-container">
            <div class="spinner" id="player-spin"></div>
            <iframe id="player-iframe" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const TMDB_KEY = '04c35731a5ee918f014970082a0088b1';
        let currentMovieId = null;

        window.onscroll = function() {
            const nav = document.getElementById('navbar');
            if (window.scrollY > 50) nav.style.background = '#0f0f0f';
            else nav.style.background = 'linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, transparent 100%)';
        };

        async function fetchMovies() {
            try {
                const trendRes = await fetch(`https://api.themoviedb.org/3/trending/movie/day?api_key=${TMDB_KEY}`);
                const trendData = await trendRes.json();
                const popRes = await fetch(`https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}`);
                const popData = await popRes.json();

                if (trendData.results.length > 0) {
                    const heroMovie = trendData.results[0];
                    document.getElementById('hero-title').innerText = heroMovie.title;
                    document.getElementById('hero-desc').innerText = heroMovie.overview;
                    document.getElementById('hero-year').innerText = heroMovie.release_date.split('-')[0];
                    document.getElementById('hero-banner').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${heroMovie.backdrop_path})`;
                    document.getElementById('hero-play-btn').onclick = () => openPlayer(heroMovie.id, heroMovie.title);
                }

                renderRow(trendData.results, 'trending-row');
                renderRow(popData.results, 'movies-row');

            } catch (e) { console.error("API Failed", e); }
        }

        function renderRow(movies, containerId) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            movies.forEach(movie => {
                if(!movie.poster_path) return;
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="https://image.tmdb.org/t/p/w500${movie.poster_path}" alt="${movie.title}">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-year">${movie.release_date ? movie.release_date.split('-')[0] : 'N/A'}</div>
                    </div>
                `;
                card.onclick = () => openPlayer(movie.id, movie.title);
                container.appendChild(card);
            });
        }

        function openPlayer(movieId, title) {
            currentMovieId = movieId;
            document.getElementById('player-title').innerText = "Watching: " + title;
            document.getElementById('player-overlay').classList.add('active');
            
            const iframe = document.getElementById('player-iframe');
            const spinner = document.getElementById('player-spin');
            
            spinner.style.display = 'block';
            iframe.style.display = 'none';
            
            // Load TripleT Server in fullscreen overlay
            iframe.src = `https://triplet.getfounddsos.net/embed/movie/${movieId}`;
            
            iframe.onload = () => {
                spinner.style.display = 'none';
                iframe.style.display = 'block';
            };
        }

        function closePlayer() {
            document.getElementById('player-overlay').classList.remove('active');
            document.getElementById('player-iframe').src = '';
        }

        fetchMovies();
    </script>
</body>
</html>
